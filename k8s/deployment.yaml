apiVersion: apps/v1
kind: Deployment
metadata:
  name: artisanmarket-client
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-client
    app.kubernetes.io/part-of: artisanmarket
    app.kubernetes.io/component: client
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: artisanmarket-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artisanmarket-client
        app.kubernetes.io/part-of: artisanmarket
        app.kubernetes.io/component: client
    spec:
      # A static file server calls no Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 101 is the `nginx` user in nginx:alpine, which owns the served files.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          # Tag is rewritten by the Deploy stage. Never :latest.
          image: ghcr.io/immanueln/artisanmarket-client:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          # No env and no Secret: this is a static bundle. Every VITE_* value is
          # inlined at build time and is public by definition (threat T3), so
          # there is nothing here to inject and nothing worth protecting.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
          # readOnlyRootFilesystem is on, so nginx's writable paths are mounted
          # explicitly. The image rewrites its pid path to /var/run to match.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 8Mi
