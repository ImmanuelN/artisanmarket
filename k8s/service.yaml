apiVersion: v1
kind: Service
metadata:
  name: artisanmarket-client
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-client
    app.kubernetes.io/part-of: artisanmarket
    app.kubernetes.io/component: client
spec:
  # ClusterIP, not LoadBalancer: traffic arrives through an ingress that
  # terminates TLS. Port 80 here maps to the container's unprivileged 8080,
  # which is what lets the pod run as a non-root user.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: artisanmarket-client
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
