# SonarQube Cloud (SonarCloud) analysis configuration — Code stage (4.3.2)
#
# The organization key was confirmed against the SonarCloud API rather than
# assumed. The project key follows SonarCloud's convention for a project
# imported from GitHub: <GitHubLogin>_<repository>. Note the project key keeps
# the original GitHub login casing while the organization key is lowercased --
# both were read back from the SonarCloud API, not assumed. If the project was imported
# under a different key, correct it here — the scan fails fast rather than
# silently analysing the wrong project.
sonar.organization=immanueln
sonar.projectKey=ImmanuelN_artisanmarket
sonar.projectName=ArtisanMarket Client

# Analysis scope. TypeScript/TSX under src/ is the application; everything
# excluded below is third-party, generated, or not application code.
sonar.sources=src
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  dev-dist/**,\
  coverage/**,\
  src/assets/**,\
  **/*.d.ts

# Lets Sonar resolve imports and types instead of falling back to a
# syntax-only analysis, which would miss most data-flow findings.
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.scm.provider=git
