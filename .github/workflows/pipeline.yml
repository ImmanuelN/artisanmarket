name: DevSecOps Pipeline

# Implements the six-stage model from Chapter 4 (Plan, Code, Build, Staging,
# Deploy, Monitor) mapped onto a three-branch promotion flow:
#
#   dev      →  Plan + Code            fast feedback on every feature merge:
#                                      SAST, secret scanning, SCA baseline
#   staging  →  + Build + Staging      deep scanning before release:
#                                      SCA, container, IaC, DAST against a
#                                      real production build
#   main     →  + Deploy + Monitor     full production release gate, and a
#                                      compliance report built from the
#                                      actual result of every control. main
#                                      is also re-verified on a daily schedule.
#
# Each stage is cumulative: staging re-runs everything dev runs, and main
# re-runs everything staging runs.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SONAR_TOKEN, SONAR_HOST_URL  - SonarQube/SonarCloud (Code stage, SAST)
#   SNYK_TOKEN                   - Snyk (Build stage, SCA) — optional; the job
#                                  falls back to `npm audit` when unset

on:
  push:
    branches: [dev, staging, main, master]
  pull_request:
    branches: [dev, staging, main, master]
  # Monitor: main is re-verified daily, without needing a commit. A commit that
  # passed every gate can still become vulnerable when an advisory is published
  # against something it already ships. That happened twice — CVE-2026-103111
  # in pcre2 and GHSA-vfj7-8cjw-p6xm in braces — and both surfaced only because
  # an unrelated commit happened to trigger a run. A scheduled run on the default
  # branch resolves to production, so it runs every stage.
  # GitHub disables scheduled workflows in a public repository after 60 days
  # without activity; re-enable from the Actions tab if that happens.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

# Least privilege at workflow level; security-events: write is granted only to
# the job that uploads SARIF (S8233).
permissions:
  contents: read

jobs:
  # ---- Resolve which promotion stage this run belongs to ----
  context:
    name: "Context · resolve promotion stage"
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      deep_scan: ${{ steps.resolve.outputs.deep_scan }}
      production: ${{ steps.resolve.outputs.production }}
    steps:
      - name: Resolve target branch
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET="${{ github.base_ref }}"
          else
            TARGET="${{ github.ref_name }}"
          fi
          case "$TARGET" in
            main|master) DEEP=true;  PROD=true  ;;
            staging)     DEEP=true;  PROD=false ;;
            *)           DEEP=false; PROD=false ;;
          esac
          {
            echo "target=$TARGET"
            echo "deep_scan=$DEEP"
            echo "production=$PROD"
          } >> "$GITHUB_OUTPUT"
          echo "Promotion target: $TARGET (deep scan: $DEEP, production: $PROD)"

  # ---- Plan (4.3.1): threat model gate ----
  #
  # docs/threat-model.json is an OWASP Threat Dragon v2 model. The gate fails if
  # any High or Critical threat is Open, if a threat marked Mitigated or Accepted
  # does not state its mitigation, or if the model has no threats at all. It
  # replaces a check that passed on any file named docs/threat-model.md.
  plan-check:
    name: "Plan · threat model present"
    needs: context
    runs-on: ubuntu-latest
    outputs:
      threat_model: ${{ steps.threat-model.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Threat model gate (OWASP Threat Dragon)
        id: threat-model
        run: node scripts/threat-model-gate.mjs docs/threat-model.json

  # ---- Code (4.3.2, 4.3.3): SAST + secret scanning — runs on dev, staging and main ----
  code-security:
    name: "Code · SAST + secret scanning"
    permissions:
      contents: read
      security-events: write
    needs: [context, plan-check]
    runs-on: ubuntu-latest
    # Step outcomes are exported so the Monitor stage can report each control
    # on its own rather than the job as a whole.
    outputs:
      eslint: ${{ steps.eslint.outcome }}
      tests: ${{ steps.tests.outcome }}
      gitleaks: ${{ steps.gitleaks.outcome }}
      sast: ${{ steps.sast.outcome }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts

      # Reported, not gated. The project's own `build` script skips tsc by design
      # (`build:check` is the type-checking variant), and the ~95 pre-existing
      # errors are overwhelmingly unused-variable noise. Blocking here would mask
      # the security gate below, which is the point of this stage.
      - name: TypeScript type check (advisory)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: ESLint (security ruleset)
        id: eslint
        run: |
          if ls .eslintrc* >/dev/null 2>&1 || ls eslint.config.* >/dev/null 2>&1; then
            npm run lint
          else
            echo "::warning::No ESLint configuration found in this repository, so the Code-stage lint gate is inactive. Add .eslintrc.cjs (or eslint.config.js) to activate it."
          fi

      # Every Code-stage scanner reports on every run. Without !cancelled() a
      # single failing scanner short-circuits the rest of the job, so a lint
      # failure would silently suppress secret scanning and SAST.
      # Tests run before SonarQube so the lcov report exists when the scanner
      # uploads. Without coverage data the quality gate fails on new_coverage
      # no matter how much is actually tested.
      - name: Unit tests with coverage
        id: tests
        if: '!cancelled()'
        run: npm run test:coverage

      # Push and pull_request scans cover only the commits being introduced. On
      # schedule and workflow_dispatch, Gitleaks scans the full history of every
      # ref the checkout fetched — and fetch-depth: 0 fetches every branch,
      # including the seeded-case branches, which carry a deliberately committed
      # secret. A monitoring run measures the branch that ships, so its history
      # scan is scoped to that branch. Tags are kept; all of them are on main.
      - name: Scope the history scan to the branch being verified
        if: "!cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')"
        env:
          KEEP: ${{ github.ref_name }}
        run: |
          git for-each-ref --format='%(refname)' refs/remotes/origin refs/heads \
            | grep -vxE "refs/(remotes/origin|heads)/(${KEEP}|HEAD)" \
            | xargs -r -n1 git update-ref -d
          echo "Refs in scope: $(git for-each-ref --format='%(refname:short)' refs/heads refs/remotes | tr '\n' ' ')"

      - name: Gitleaks (secret scanning)
        id: gitleaks
        if: '!cancelled()'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube (SAST)
        id: sast
        if: '!cancelled() && env.SONAR_TOKEN != '''' && env.SONAR_HOST_URL != '''''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2

      - name: SonarQube not configured
        if: '!cancelled() && (env.SONAR_TOKEN == '''' || env.SONAR_HOST_URL == '''')'
        run: echo "::warning::SONAR_TOKEN / SONAR_HOST_URL are not set, so the SonarQube SAST gate was skipped."

  # ---- Code (4.3.4): SCA baseline — cheap enough to run on every branch ----
  dependency-audit:
    name: "Code · SCA baseline (npm audit)"
    needs: [context, plan-check]
    runs-on: ubuntu-latest
    outputs:
      audit: ${{ steps.audit.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      # Blocking on the FULL dependency tree, dev dependencies included.
      #
      # This was previously scoped to --omit=dev because vite 4 carried
      # unfixable high-severity dev-server advisories, which narrowed
      # supply-chain coverage: a compromised build tool can affect the bundle
      # even though it never ships. The Vite 7 upgrade cleared them, so the
      # scoping compromise has been reverted rather than left in place.
      #
      # GHSA-vfj7-8cjw-p6xm (braces) then arrived with no released fix at all,
      # and the scoping was deliberately not reinstated. scripts/audit-gate.mjs
      # keeps the whole tree in scope and lets a named advisory be accepted in
      # .audit-allowlist.json with a reason and a review date, so the coverage
      # stays, the exception is visible on every run, and it expires.
      #
      # npm audit exits non-zero whenever it finds anything, so its exit code is
      # discarded and the decision is made by the gate. The gate fails closed:
      # empty, malformed or error output — a registry outage, say — is a
      # failure, never a clean tree.
      - name: Dependency audit
        id: audit
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/audit-gate.mjs npm-audit.json --level=high

  # ---- Build (4.3.4, 4.3.5, 4.3.6): deep SCA + container + IaC — staging and main only ----
  build-security:
    name: "Build · SCA + container + IaC scanning"
    needs: [context, code-security, dependency-audit]
    if: needs.context.outputs.deep_scan == 'true'
    runs-on: ubuntu-latest
    outputs:
      snyk: ${{ steps.snyk.outcome }}
      trivy_image: ${{ steps.trivy-image.outcome }}
      trivy_fs: ${{ steps.trivy-fs.outcome }}
      iac: ${{ steps.checkov-k8s.outcome }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts

      - name: Production build
        run: npm run build

      - name: Detect available scan targets
        id: detect
        run: |
          if [ -f Dockerfile ]; then
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Dockerfile in this repository — the container build and Trivy image scan were skipped."
          fi
          if [ -d k8s ]; then
            echo "k8s=true" >> "$GITHUB_OUTPUT"
          else
            echo "k8s=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No k8s/ directory — the Checkov Kubernetes scan was skipped."
          fi
          if [ -f docker-compose.yml ]; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No docker-compose.yml — the Checkov compose scan was skipped."
          fi

      - name: Snyk (SCA)
        id: snyk
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@b075801f26076be9bb50521154cafab73f44da0c # master
        continue-on-error: true
        with:
          args: --severity-threshold=high

      - name: Snyk not configured
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN is not set — falling back to the npm audit baseline from the Code stage."

      - name: Build container image
        if: steps.detect.outputs.dockerfile == 'true'
        run: docker build -t artisanmarket-client:${{ github.sha }} .

      - name: Trivy (container image scan)
        id: trivy-image
        if: "!cancelled() && steps.detect.outputs.dockerfile == 'true'"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "artisanmarket-client:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Trivy (dependency and config scan of the working tree)
        id: trivy-fs
        if: '!cancelled()'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          skip-dirs: "node_modules,dist"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Checkov (IaC scan — Kubernetes manifests)
        id: checkov-k8s
        if: "!cancelled() && steps.detect.outputs.k8s == 'true'"
        uses: bridgecrewio/checkov-action@5798bad4f6dd9c1fb67ae3ec10d42d8fb67037c4 # v12.3126.0
        with:
          directory: k8s
          quiet: true
          soft_fail: false

      - name: Checkov (IaC scan — docker-compose)
        if: "!cancelled() && steps.detect.outputs.compose == 'true'"
        uses: bridgecrewio/checkov-action@5798bad4f6dd9c1fb67ae3ec10d42d8fb67037c4 # v12.3126.0
        with:
          file: docker-compose.yml
          quiet: true
          soft_fail: false

  # ---- Staging (4.3.7): DAST against the built SPA — staging and main only ----
  staging-dast:
    name: "Staging · DAST"
    needs: [context, code-security, build-security]
    if: needs.context.outputs.deep_scan == 'true'
    runs-on: ubuntu-latest
    outputs:
      dast: ${{ steps.zap.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts

      - name: Build and serve the production bundle
        run: |
          npm run build
          nohup npx vite preview --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          npx --yes --ignore-scripts wait-on@8.0.1 http://127.0.0.1:4173 --timeout 60000

      - name: OWASP ZAP baseline scan (DAST)
        id: zap
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://127.0.0.1:4173"
          # Host-layer header rules are scoped out with a documented
          # justification per rule; see .zap/rules.tsv and threat T5.
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false

      - name: Upload preview log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-preview-log
          path: preview.log
          if-no-files-found: ignore

  # ---- Deploy (4.3.8): release gate — main only ----
  release-gate:
    name: "Deploy · production release gate"
    needs: [context, plan-check, code-security, dependency-audit, build-security, staging-dast]
    if: needs.context.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Release decision
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Re-verification: every upstream gate still passes for $SHA. Nothing is released by this run."
          else
            echo "All upstream gates passed — build $SHA is cleared for production release."
          fi

  # ---- Monitor: compliance report from the actual result of every control ----
  #
  # Runs on main after every promotion and on the daily schedule. It reads the
  # outcome of each control from the jobs above, so a control that failed or
  # never ran is reported as such. The summary it replaces printed fixed text,
  # and said the release gate had passed on runs where the gate was skipped.
  #
  # The report maps each control to the PCI DSS and GDPR requirement it
  # supports, lists the advisories the dependency gate is accepting and when
  # each must be reviewed, and fails unless every required control passed. A
  # copy is kept as a run artifact for 90 days, giving the posture a dated
  # history. See scripts/compliance-report.mjs.
  monitor:
    name: "Monitor · compliance summary"
    needs: [context, plan-check, code-security, dependency-audit, build-security, staging-dast, release-gate]
    if: always() && needs.context.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build the compliance report
        env:
          OUTCOME_THREAT_MODEL: ${{ needs.plan-check.outputs.threat_model }}
          OUTCOME_ESLINT: ${{ needs.code-security.outputs.eslint }}
          OUTCOME_TESTS: ${{ needs.code-security.outputs.tests }}
          OUTCOME_GITLEAKS: ${{ needs.code-security.outputs.gitleaks }}
          OUTCOME_SAST: ${{ needs.code-security.outputs.sast }}
          OUTCOME_SCA: ${{ needs.dependency-audit.outputs.audit }}
          OUTCOME_SNYK: ${{ needs.build-security.outputs.snyk }}
          OUTCOME_TRIVY_FS: ${{ needs.build-security.outputs.trivy_fs }}
          OUTCOME_TRIVY_IMAGE: ${{ needs.build-security.outputs.trivy_image }}
          OUTCOME_IAC: ${{ needs.build-security.outputs.iac }}
          OUTCOME_DAST: ${{ needs.staging-dast.outputs.dast }}
          OUTCOME_RELEASE_GATE: ${{ needs.release-gate.result }}
        run: node scripts/compliance-report.mjs

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compliance-report
          path: |
            compliance-report.md
            compliance-report.json
          retention-days: 90
          if-no-files-found: error
