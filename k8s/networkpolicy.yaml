# Default-deny, then allow only what a static file server needs (CKV2_K8S_6).
#
# This workload serves pre-built files and originates no traffic of its own —
# the browser calls the API directly, not the pod. Its egress is therefore
# limited to DNS, and it accepts ingress only from the ingress controller.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artisanmarket-client-default-deny
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-client
    app.kubernetes.io/part-of: artisanmarket
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artisanmarket-client
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artisanmarket-client-allow
  namespace: artisanmarket
  labels:
    app.kubernetes.io/name: artisanmarket-client
    app.kubernetes.io/part-of: artisanmarket
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artisanmarket-client
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS only. Everything else the site needs is fetched by the visitor's
    # browser, not by this pod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
