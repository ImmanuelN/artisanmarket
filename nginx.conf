# Static serving for the ArtisanMarket SPA.
#
# Security response headers are set here because they are the static host's
# responsibility, not the bundle's — see threat T5 in docs/threat-model.md.
# The DAST gate scans `vite preview` in CI, which serves no headers, so those
# rules are scoped out in .zap/rules.tsv; this file is where the real policy
# lives for a containerised deployment.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # ---- security headers (threat T5) ----
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "DENY"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"              always;

    # CSP allows Stripe (checkout iframe + js) and ImageKit (product media),
    # which are the only third parties the client loads. 'unsafe-inline' is
    # required for styles because Tailwind injects them at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ik.imagekit.io; font-src 'self' data:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets are immutable and safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The service worker and manifest must never be cached, or clients pin to a
    # stale build (vite-plugin-pwa registerType: autoUpdate).
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths are client-side routes.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Do not serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
